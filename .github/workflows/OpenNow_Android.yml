name: Build Android
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository (owner/repo)
        required: true
        default: Chizuui/OpenNOW-Modified
      branch:
        description: Branch
        required: true
        default: android-native-live-features
      build_type:
        description: Build Type
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      publish_release:
        description: Publish GitHub Release
        required: true
        default: true
        type: boolean
      release_type:
        description: Release Type
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Prerelease
      tag:
        description: Release Tag (boleh pakai spasi)
        required: true
        default: v1.0.0 Build 1
      release_title:
        description: Release Title
        required: true
        default: OpenNOW Android
      commit_links:
        description: 'Commit links (pipe-separated: link1 | link2 | link3)'
        required: false
        default: ''
      manual_description:
        description: Release Description (gunakan jika commit_links kosong)
        required: false
        default: |
          ## Changelog
          - Built with GitHub Actions
          - Latest features included

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8g"
    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Clone Target Repository
        run: |
          git clone --recursive https://github.com/${{ github.event.inputs.repository }}.git source
          cd source
          git checkout ${{ github.event.inputs.branch }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK Components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.13846066"

      - name: Make gradlew executable
        working-directory: source/android
        run: chmod +x gradlew

      - name: Build Release
        if: github.event.inputs.build_type == 'Release'
        working-directory: source/android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build Debug
        if: github.event.inputs.build_type == 'Debug'
        working-directory: source/android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-${{ github.event.inputs.build_type }}
          path: source/android/app/build/outputs/**/*.apk

      - name: Prepare Release Tag
        if: github.event.inputs.publish_release == 'true'
        run: |
          TAG="${{ github.event.inputs.tag }}"
          TAG=$(echo "$TAG" | tr ' ' '-')
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV

      - name: Set Release Type
        if: github.event.inputs.publish_release == 'true'
        run: |
          if [ "${{ github.event.inputs.release_type }}" == "Prerelease" ]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Extract Commit Messages
        if: github.event.inputs.publish_release == 'true' && github.event.inputs.commit_links != ''
        id: commits
        run: |
          COMMIT_LINKS="${{ github.event.inputs.commit_links }}"
          
          # Split by pipe dan process setiap link
          IFS='|' read -ra LINKS <<< "$COMMIT_LINKS"
          
          {
            echo "## Commits Included"
            echo ""
            
            for link in "${LINKS[@]}"; do
              link=$(echo "$link" | xargs)  # trim whitespace
              
              # Extract owner/repo dan commit hash dari GitHub URL
              if [[ $link =~ github\.com/([^/]+)/([^/]+)/commit/([a-f0-9]+) ]]; then
                OWNER="${BASH_REMATCH[1]}"
                REPO="${BASH_REMATCH[2]}"
                COMMIT_HASH="${BASH_REMATCH[3]}"
                SHORT_HASH="${COMMIT_HASH:0:7}"
                
                # Fetch commit data pake GitHub API
                COMMIT_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/repos/$OWNER/$REPO/commits/$COMMIT_HASH")
                
                # Extract full message (handle multi-line)
                COMMIT_MESSAGE=$(echo "$COMMIT_DATA" | jq -r '.commit.message' 2>/dev/null || echo "")
                
                if [ ! -z "$COMMIT_MESSAGE" ]; then
                  # Ambil title line (first line) doang untuk header
                  COMMIT_TITLE=$(echo "$COMMIT_MESSAGE" | head -1)
                  
                  # Format: [hash] (link) + title
                  echo "### [$SHORT_HASH]($link) $COMMIT_TITLE"
                  echo ""
                  
                  # Jika ada body (multi-line), tampilkan dengan indent
                  COMMIT_BODY=$(echo "$COMMIT_MESSAGE" | tail -n +2 | sed '/^$/d')
                  if [ ! -z "$COMMIT_BODY" ]; then
                    echo "\`\`\`"
                    echo "$COMMIT_BODY"
                    echo "\`\`\`"
                    echo ""
                  fi
                fi
              fi
            done
          } > /tmp/commit_description.txt
          
          # Save ke GITHUB_OUTPUT dengan proper EOF handling
          {
            echo "commit_description<<EOF"
            cat /tmp/commit_description.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Determine Release Body
        if: github.event.inputs.publish_release == 'true'
        id: body
        env:
          MANUAL_DESC: ${{ github.event.inputs.manual_description }}
          COMMIT_DESC: ${{ steps.commits.outputs.commit_description }}
        run: |
          if [ -z "${{ github.event.inputs.commit_links }}" ]; then
            {
              echo "release_body<<EOF"
              echo "$MANUAL_DESC"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "release_body<<EOF"
              cat /tmp/commit_description.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ github.event.inputs.release_title }}
          body: ${{ steps.body.outputs.release_body }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          overwrite_files: true
          files: |
            source/android/app/build/outputs/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
